[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airq-edge-gateway"
version = "0.1.0"
description = "Edge gateway: PM/VOC/NOx + CO2 sensors over I2C (or a mock bus) to MQTT, InfluxDB and HTTP, with an offline buffer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sensirion-i2c-driver>=1.0.2",
    "sensirion-i2c-sen5x>=0.1.1",
    "sensirion-i2c-scd>=0.1.2",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8", "paho-mqtt>=2.0"]

[project.scripts]
airq = "airq.cli:main"

[tool.setuptools]
packages = ["airq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
